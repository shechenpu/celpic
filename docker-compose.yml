services:
  celpic:
    build: .
    container_name: celpic
    restart: unless-stopped
    ports:
      - "${PORT:-1018}:1018"
    environment:
      NODE_ENV: production
      PORT: 1018
      DATA_DIR: /data
      CELPIC_STORAGE_DIR: /data/images
      MAX_UPLOAD_MB: 20
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    volumes:
      - ./data:/data
    # Single-purpose container; root avoids first-run bind-mount permission errors.
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m
